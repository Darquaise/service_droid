[project]
name = "service-droid"
version = "0.1.0"
description = "service_droid — py-cord Discord bot (LFG, Trivia, Galatron)."
requires-python = ">=3.14"
dependencies = [
    "py-cord>=2.8.0",
    "croniter>=6.2.2",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "mcstatus>=14.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"main.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["e2e"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-rfE"
markers = [
    "e2e: needs the live Discord test guild (added automatically to tests using the e2e fixture)",
    "offline: harness self-tests without Discord (the persistence ones also need the throwaway database)",
]
